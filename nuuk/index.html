*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

/* ===== PALETTE ===== */
:root {
  --lilac: #E7B6C4;
  --amber: #D89A4E;
  --amber-light: #E6B475;
  --emerald: #6FBF8E;
  --slate: #4A6A7C;
  --indigo: #0E1620;

  --midnight: #111A26;
  --rust: #9A4A35;
  --bone: #F2EBE1;
  --sand: #D9C8A5;
  --text-dark: #1a1a2e;
  --text-body: #2c2c3e;
  --text-light: #E5ECF2;
  --text-muted: #7A8A98;
  --divider: rgba(216, 154, 78, 0.25);
}

/* ===== LOADING SCREEN ===== */
.loading-screen {
  position: fixed; inset: 0;
  background: var(--indigo);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 9999;
  transition: opacity .8s ease, visibility .8s ease;
}
.loading-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
.loading-logo {
  color: var(--amber);
  font-family: 'Cinzel', serif;
  font-size: .72rem;
  letter-spacing: .4em;
  text-transform: uppercase;
  margin-bottom: 2rem;
  opacity: .85;
}
.loading-bar {
  width: 120px; height: 1px;
  background: rgba(216,154,78,.15);
  position: relative; overflow: hidden;
}
.loading-bar::after {
  content: ''; position: absolute;
  left: 0; top: 0; bottom: 0; width: 40%;
  background: var(--amber);
  animation: loadSlide 1.2s ease-in-out infinite;
}
@keyframes loadSlide { 0%{left:-40%} 100%{left:100%} }

/* ===== SECTION BASE ===== */
.section {
  min-height: 100vh;
  min-height: 100dvh;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  overflow: hidden;
}
.section-inner {
  padding: 60px 28px;
  max-width: 560px;
  margin: 0 auto;
  width: 100%;
}

.content-section { background: var(--bone); color: var(--text-body); }
.dark-section    { background: var(--indigo); color: var(--text-light); }
.midnight-section{ background: var(--midnight); color: var(--text-light); }

/* ===== FULL-BLEED IMAGE SECTIONS ===== */
.full-image-section {
  position: relative;
  min-height: 100vh;
  min-height: 100dvh;
  color: white;
}
.full-image-bg {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}
.full-image-overlay {
  position: absolute; inset: 0;
}
.full-image-content {
  position: relative;
  z-index: 2;
  padding: 60px 28px;
  max-width: 560px;
  margin: 0 auto;
  width: 100%;
  min-height: 100dvh;

  flex-direction: column;
}

/* ===== SCROLL FADE ===== */
.fade-in {
  opacity: 0;
  transform: translateY(24px);
  transition: opacity .9s ease, transform .9s ease;
}
.fade-in.visible { opacity: 1; transform: translateY(0); }
.fade-in-delay-1 { transition-delay: .15s; }
.fade-in-delay-2 { transition-delay: .30s; }
.fade-in-delay-3 { transition-delay: .45s; }

/* ===== KEYFRAMES (shared) ===== */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@keyframes drawLine {

@media (max-width: 480px) {
