/* ===== RESET & BASE ===== */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html {
  font-size: 18px;
  scroll-behavior: smooth;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}
body {
  font-family: 'OPPOSans','Noto Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  color: #2c2c3e;
  background: #0E1620;
  line-height: 1.9;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
img { max-width: 100%; height: auto; display: block; }
a { color: inherit; text-decoration: none; }

/* ===== PALETTE ===== */
:root {
  --lilac: #E7B6C4;
  --amber: #D89A4E;
  --amber-light: #E6B475;
  --emerald: #6FBF8E;
  --slate: #4A6A7C;
  --indigo: #0E1620;
  --indigo-deep: #070C12;
  --midnight: #111A26;
  --rust: #9A4A35;
  --bone: #F2EBE1;
  --sand: #D9C8A5;
  --text-dark: #1a1a2e;
  --text-body: #2c2c3e;
  --text-light: #E5ECF2;
  --text-muted: #7A8A98;
  --divider: rgba(216, 154, 78, 0.25);
}

/* ===== LOADING SCREEN ===== */
.loading-screen {
  position: fixed; inset: 0;
  background: var(--indigo);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 9999;
  transition: opacity .8s ease, visibility .8s ease;
}
.loading-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
.loading-logo {
  color: var(--amber);
  font-family: 'Cinzel', serif;
  font-size: .72rem;
  letter-spacing: .4em;
  text-transform: uppercase;
  margin-bottom: 2rem;
  opacity: .85;
}
.loading-bar {
  width: 120px; height: 1px;
  background: rgba(216,154,78,.15);
  position: relative; overflow: hidden;
}
.loading-bar::after {
  content: ''; position: absolute;
  left: 0; top: 0; bottom: 0; width: 40%;
  background: var(--amber);
  animation: loadSlide 1.2s ease-in-out infinite;
}
@keyframes loadSlide { 0%{left:-40%} 100%{left:100%} }
</style>

<body>

<!-- ===== LOADING ===== -->
<div class="loading-screen" id="loadingScreen">
  <div class="loading-logo">WHALEBAY · NUUK</div>
  <div class="loading-bar"></div>
</div>

<!-- ===== MAIN ===== -->
<main id="app">
  <!-- sections will be added in subsequent tasks -->
</main>

<!-- ===== JAVASCRIPT ===== -->
<script>
// Loading screen hider
window.addEventListener('load', function() {
  setTimeout(function() {
    document.getElementById('loadingScreen').classList.add('hidden');
  }, 800);
});
// Fallback: hide after 3s max even if load event is slow
setTimeout(function() {
  var el = document.getElementById('loadingScreen');
  if (el) el.classList.add('hidden');
}, 3000);
</script>

</body>
