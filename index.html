<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>北极 · 鲸湾探索</title>
<meta name="description" content="鲸湾探索 · 北极线路 — 帆向格陵兰、北极追光（纳努克峡湾）">

<meta property="og:title" content="北极 · 鲸湾探索">
<meta property="og:description" content="鲸湾探索北极线路 · 帆向格陵兰 · 北极追光">
<meta property="og:image" content="https://arctic.whalebay.world/assets/arctic-hero.jpg">
<meta property="og:url" content="https://arctic.whalebay.world/">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@300;400;500;700&family=Cinzel:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html { font-size:18px; scroll-behavior:smooth; -webkit-font-smoothing:antialiased; }
  body { font-family:'Noto Sans SC','PingFang SC',sans-serif; color:#1a1a2e; background:#0a0a12; line-height:1.8; }
  img { max-width:100%; height:auto; display:block; }
  a { color:inherit; text-decoration:none; }

  :root {
    --bg-deep:#0a0a12;
    --bg-card:#13131e;
    --gold:#c8a86e;
    --gold-light:#dfc295;
    --text-light:#e8e8ec;
    --text-muted:#8a8a9a;
    --divider:rgba(200,168,110,0.25);
  }

  /* SHARED TOP BAR */
  .wb-topbar { position:fixed; top:0; left:0; right:0; z-index:100; height:56px; display:flex; align-items:center; justify-content:space-between; padding:0 24px; background:rgba(10,10,18,0.75); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid rgba(255,255,255,0.08); }
  .wb-topbar a { color:#f0f0f5; font-size:0.78rem; letter-spacing:0.12em; }
  .wb-brand { font-family:'Cinzel',serif; font-weight:500; }
  .wb-brand .zh { font-family:'Noto Serif SC',serif; margin-right:0.5em; letter-spacing:0.08em; }
  .wb-back { opacity:0.7; transition:opacity .2s; }
  .wb-back:hover { opacity:1; }
  @media (max-width:600px) { .wb-topbar { height:48px; padding:0 16px; } .wb-topbar a { font-size:0.7rem; } }

  /* HERO */
  .hero { position:relative; height:70vh; min-height:480px; display:flex; align-items:center; justify-content:center; flex-direction:column; text-align:center; color:#fff; overflow:hidden; }
  .hero::before { content:""; position:absolute; inset:0; background:url('assets/arctic-hero.jpg') center/cover no-repeat; }
  .hero::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(10,10,18,0.35) 0%, rgba(10,10,18,0.75) 100%); }
  .hero > * { position:relative; z-index:2; }
  .hero .label { font-family:'Cinzel',serif; font-size:0.85rem; letter-spacing:0.4em; color:rgba(255,255,255,0.8); margin-bottom:24px; }
  .hero h1 { font-family:'Noto Serif SC',serif; font-size:clamp(3rem, 9vw, 5rem); font-weight:300; letter-spacing:0.2em; }
  .hero .tagline { font-family:'Noto Serif SC',serif; font-size:clamp(0.95rem, 2vw, 1.1rem); margin-top:24px; letter-spacing:0.2em; color:rgba(255,255,255,0.8); max-width:560px; line-height:1.9; padding:0 24px; }

  /* PRODUCTS */
  .products { background:var(--bg-deep); padding:80px 24px 96px; }
  .products .container { max-width:1100px; margin:0 auto; }
  .products .section-label { font-family:'Cinzel',serif; font-size:0.8rem; letter-spacing:0.35em; color:var(--gold); text-align:center; margin-bottom:8px; }
  .products .section-title { font-family:'Noto Serif SC',serif; font-size:1.5rem; font-weight:400; color:var(--text-light); text-align:center; margin-bottom:56px; letter-spacing:0.1em; }
  .grid { display:grid; gap:24px; grid-template-columns:repeat(2,1fr); }
  @media (max-width:700px) { .grid { grid-template-columns:1fr; gap:18px; } }
  .product-box { position:relative; overflow:hidden; border-radius:6px; aspect-ratio:4/3; min-height:340px; background:var(--bg-card); transition:transform .4s, box-shadow .4s; display:block; }
  .product-box::before { content:""; position:absolute; inset:0; background-size:cover; background-position:center; transition:transform .6s, filter .4s; filter:brightness(0.72) saturate(1.05); }
  .product-box::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(10,10,18,0.0) 30%, rgba(10,10,18,0.85) 100%); }
  .product-box:hover { transform:translateY(-4px); box-shadow:0 16px 48px rgba(0,0,0,0.5); }
  .product-box:hover::before { transform:scale(1.05); filter:brightness(0.82); }
  .product-box.ilulissat::before { background-image:url('assets/products/ilulissat-thumb.jpg'); }
  .product-box.nuuk::before { background-image:url('assets/products/nuuk-thumb.jpg'); }
  .product-box .content { position:absolute; left:24px; right:24px; bottom:24px; z-index:2; color:#fff; }
  .product-box .zh-name { font-family:'Noto Serif SC',serif; font-size:1.7rem; font-weight:400; letter-spacing:0.1em; margin-bottom:8px; }
  .product-box .en-name { font-family:'Cinzel',serif; font-size:0.8rem; letter-spacing:0.3em; color:var(--gold-light); margin-bottom:12px; }
  .product-box .teaser { font-size:0.9rem; line-height:1.7; color:rgba(255,255,255,0.78); }

  /* FOOTER */
  .wb-footer { background:#070710; color:#8a8a9a; padding:48px 24px 32px; text-align:center; font-size:0.85rem; }
  .wb-footer .qr { width:120px; margin:0 auto 16px; border:8px solid #fff; border-radius:4px; }
  .wb-footer .email { color:var(--gold-light); margin:8px 0; font-family:'Cinzel',serif; }
  .wb-footer .copy { font-size:0.7rem; opacity:0.5; margin-top:24px; letter-spacing:0.1em; }
</style>
</head>
<body>

<header class="wb-topbar">
  <a href="https://whalebay.world" class="wb-brand"><span class="zh">鲸湾探索</span>WHALEBAY EXPEDITIONS</a>
  <a href="https://whalebay.world" class="wb-back">← 返回首页</a>
</header>

<section class="hero">
  <div class="label">ARCTIC</div>
  <h1>北极</h1>
  <p class="tagline">复古帆船 · 深入峡湾 · 极光大年 — 我们在格陵兰开发的两条线路，由我们亲自勘线、带队。</p>
</section>

<section class="products">
  <div class="container">
    <div class="section-label">EXPEDITIONS</div>
    <div class="section-title">北极线路</div>
    <div class="grid">

      <a class="product-box ilulissat" href="/ilulissat/">
        <div class="content">
          <div class="zh-name">帆向格陵兰</div>
          <div class="en-name">ILULISSAT</div>
          <div class="teaser">2026 北极私属航季 · 复古双桅纵帆船 · 全船八席</div>
        </div>
      </a>

      <a class="product-box nuuk" href="/nuuk/">
        <div class="content">
          <div class="zh-name">北极追光</div>
          <div class="en-name">NUUK</div>
          <div class="teaser">秋日纳努克峡湾 · 因纽特家庭船宿 · 13 天 8–10 家人密友</div>
        </div>
      </a>

    </div>
  </div>
</section>

<footer class="wb-footer">
  <img class="qr" src="assets/wechat-qr.png" alt="WeChat QR" />
  <div>微信咨询 · WeChat</div>
  <div class="email">whalebayexpedition@gmail.com</div>
  <div class="copy">© 2026 鲸湾探索 · WHALEBAY EXPEDITIONS</div>
</footer>

</body>
</html>
